name: hnscc-immunotherapy
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.11.1
  - matplotlib=3.7.2
  - seaborn=0.13.2
  - anndata=0.10.5.post1
  - scanpy=1.10.2
  - scikit-learn=1.4.0
  - statsmodels=0.14.1
  - networkx=3.2.1
  - loompy=3.0.7
  - adjusttext=0.7.3
  - h5py=3.10.0
  - bottleneck>=1.3.6
variables:
  MPLCONFIGDIR: /tmp/mplconfig_hnscc_repository
  NUMBA_CACHE_DIR: /tmp/numba_cache_hnscc_repository
